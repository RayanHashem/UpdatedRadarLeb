# Snippet for Laravel + Vite (RadarLeb) behind Nginx.
# Use inside a server { } block. Adjust server_name and root as needed.

root /var/www/radarleb/public;

index index.php;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# PHP-FPM
location ~ \.php$ {
    fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;  # or 127.0.0.1:9000
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    include fastcgi_params;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 60;
    fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
}

# Vite build assets (build/assets/*)
location /build {
    alias /var/www/radarleb/public/build;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Deny hidden files
location ~ /\. {
    deny all;
}
